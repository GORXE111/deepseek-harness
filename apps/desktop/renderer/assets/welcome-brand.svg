<svg width="472" height="40" viewBox="0 0 472 40" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  :root {
    --dsw-alias-label-primary: #0f1115;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --dsw-alias-label-primary: #f9fafb;
    }
  }
</style>
<!-- DeepSeek Client wordmark: the icon's interlocked rings without their tile, then the product name. -->
<defs>
  <mask id="welcome-front-cut" maskUnits="userSpaceOnUse" x="256" y="340" width="516" height="344">
    <rect x="256" y="340" width="516" height="344" fill="#fff"/>
    <circle cx="512" cy="390.5" r="34" fill="#000"/>
  </mask>
</defs>
<svg x="92" y="0" width="60" height="40" viewBox="256 340 516 344">
  <circle cx="424" cy="512" r="150" stroke="#8e96a6" stroke-width="34" stroke-opacity="0.75"/>
  <circle cx="600" cy="512" r="150" stroke="#5b7cff" stroke-width="44" mask="url(#welcome-front-cut)"/>
</svg>
<text x="166" y="30" font-family="'Segoe UI Variable Display', 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="29" font-weight="600" fill="var(--dsw-alias-label-primary)">DeepSeek Client</text>
</svg>
