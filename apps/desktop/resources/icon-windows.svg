<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    DeepSeek Client application icon: two interlocked rings on a dark ink tile.
    The interlock reads as "connection" — this client connects a local agent
    runtime to the person using it. The rings differ in stroke weight and colour,
    so their relationship survives taskbar and tray sizes without fine detail.

    `tray-glyph` is the group scripts/render-tray-icon.ts enlarges for the tray.
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2028"/>
      <stop offset="1" stop-color="#0d1014"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0.30" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!--
      The front ring is cut at exactly one of the two crossings so the back ring
      passes through it there: cutting both reads as broken rings, cutting none as
      rings merely touching. Centres (424,512) and (600,512), radius 150, so the
      crossings sit at x=512, y=512±√(150²−88²)≈512±121.5; the upper one is cut.
    -->
    <mask id="frontCut">
      <rect x="0" y="0" width="1024" height="1024" fill="#fff"/>
      <circle cx="512" cy="390.5" r="34" fill="#000"/>
    </mask>
  </defs>

  <path fill="url(#ground)"
        d="M320 64h384c141.4 0 256 114.6 256 256v384c0 141.4-114.6 256-256 256H320C178.6 960 64 845.4 64 704V320C64 178.6 178.6 64 320 64Z"/>
  <path fill="url(#sheen)"
        d="M320 64h384c141.4 0 256 114.6 256 256v384c0 141.4-114.6 256-256 256H320C178.6 960 64 845.4 64 704V320C64 178.6 178.6 64 320 64Z"/>

  <g id="tray-glyph">
    <circle cx="424" cy="512" r="150" fill="none" stroke="#8e96a6" stroke-width="34" stroke-opacity="0.6"/>
    <circle cx="600" cy="512" r="150" fill="none" stroke="#5b7cff" stroke-width="44" mask="url(#frontCut)"/>
  </g>
</svg>
